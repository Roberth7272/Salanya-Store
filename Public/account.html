<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — SALANYA</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>

<div class="form-panel">
  <div class="tabs">
    <button class="tab-btn active" id="loginTab">Login</button>
    <button class="tab-btn" id="registerTab">Create Account</button>
  </div>

  <form id="loginForm">
    <div class="form-group"><label>Email</label><input type="email" required id="loginEmail"></div>
    <div class="form-group"><label>Password</label><input type="password" required id="loginPassword"></div>
    <div class="error-msg" id="loginError"></div>
    <button type="submit" class="btn btn-solid btn-full">Login</button>
  </form>

  <form id="registerForm" style="display:none;">
    <div class="form-group"><label>Full Name</label><input required id="regName"></div>
    <div class="form-group"><label>Email</label><input type="email" required id="regEmail"></div>
    <div class="form-group"><label>Phone</label><input id="regPhone"></div>
    <div class="form-group"><label>Password (6+ characters)</label><input type="password" required minlength="6" id="regPassword"></div>
    <div class="error-msg" id="registerError"></div>
    <button type="submit" class="btn btn-solid btn-full">Create Account</button>
  </form>
</div>

<div id="site-footer"></div>
<script src="/js/main.js"></script>
<script>
async function checkLoggedIn() {
  const me = await api('/api/auth/me');
  if (me.loggedIn) location.href = '/dashboard.html';
}
checkLoggedIn();

const loginTab = document.getElementById('loginTab');
const registerTab = document.getElementById('registerTab');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');

loginTab.onclick = () => { loginTab.classList.add('active'); registerTab.classList.remove('active'); loginForm.style.display='block'; registerForm.style.display='none'; };
registerTab.onclick = () => { registerTab.classList.add('active'); loginTab.classList.remove('active'); registerForm.style.display='block'; loginForm.style.display='none'; };

loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try {
    await api('/api/auth/login', { method: 'POST', body: JSON.stringify({
      email: document.getElementById('loginEmail').value,
      password: document.getElementById('loginPassword').value
    })});
    location.href = '/dashboard.html';
  } catch (err) { errEl.textContent = err.message; }
});

registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const errEl = document.getElementById('registerError');
  errEl.textContent = '';
  try {
    await api('/api/auth/register', { method: 'POST', body: JSON.stringify({
      name: document.getElementById('regName').value,
      email: document.getElementById('regEmail').value,
      phone: document.getElementById('regPhone').value,
      password: document.getElementById('regPassword').value
    })});
    location.href = '/dashboard.html';
  } catch (err) { errEl.textContent = err.message; }
});
</script>
</body>
</html>
