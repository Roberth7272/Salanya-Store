<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — SALANYA</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="site-header"></div>

<section class="section">
  <div class="section-title">
    <h2 id="pageTitle">All Jewellery</h2>
    <div class="rule"></div>
  </div>
  <div class="filter-bar" id="filterBar"></div>
  <div class="product-grid" id="productGrid">
    <div class="loader">Loading pieces…</div>
  </div>
</section>

<div id="site-footer"></div>
<script src="/js/main.js"></script>
<script>
async function load() {
  const params = new URLSearchParams(location.search);
  const activeCategory = params.get('category') || '';
  const bestseller = params.get('bestseller') || '';
  const q = params.get('q') || '';

  const categories = await api('/api/categories');
  const filterBar = document.getElementById('filterBar');
  filterBar.innerHTML = `<a class="filter-chip ${!activeCategory ? 'active' : ''}" href="/shop.html">All</a>` +
    categories.map(c => `<a class="filter-chip ${activeCategory===c.slug?'active':''}" href="/shop.html?category=${c.slug}">${c.name}</a>`).join('');

  let apiUrl = '/api/products?';
  if (activeCategory) apiUrl += `category=${encodeURIComponent(activeCategory)}&`;
  if (bestseller) apiUrl += `bestseller=1&`;
  if (q) apiUrl += `q=${encodeURIComponent(q)}&`;

  const title = document.getElementById('pageTitle');
  const cat = categories.find(c => c.slug === activeCategory);
  title.textContent = cat ? cat.name : (bestseller ? 'Best Sellers' : (q ? `Results for "${q}"` : 'All Jewellery'));

  try {
    const products = await api(apiUrl);
    document.getElementById('productGrid').innerHTML = products.map(productCardHTML).join('') || '<p style="grid-column:1/-1; text-align:center;">No pieces found in this collection yet.</p>';
  } catch (e) {
    document.getElementById('productGrid').innerHTML = '<p>Could not load products.</p>';
  }
}
load();
</script>
</body>
</html>
